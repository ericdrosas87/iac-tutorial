apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-pod-exec
  namespace: cnpg
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-pod-exec
  namespace: cnpg
subjects:
  - kind: ServiceAccount
    name: argocd-server
    namespace: argocd
roleRef:
  kind: Role
  name: argocd-pod-exec
  apiGroup: rbac.authorization.k8s.io
